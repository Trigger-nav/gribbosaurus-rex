# Rolex Middle Sea Race — Malta, Strait of Messina, north of Sicily,
# Egadi Islands, Pantelleria, Lampedusa, back to Malta.

name: middle-sea-race
description: Middle Sea Race — Malta round Sicily
enabled: true

bbox:
  lat_min: 35.0
  lat_max: 38.8
  lon_min: 11.0
  lon_max: 16.5

models:
  - ifs
  - aifs
  - gfs
  - icon_eu        # ICON-EU domain reaches the central Med
  - icon_2i        # Italian 2.2 km (MeteoHub open data) — domain 33.7-48.9N
                   # 3-22E covers the WHOLE course: Malta, Messina,
                   # Stromboli, Pantelleria, Lampedusa. Enabled 2026-10-15
                   # for MSR; NB runs fetched before this change are
                   # cropped to the P-M box, so MSR scoring starts with
                   # the first run fetched AFTER deploy.
  - mf_arpege      # 0.1° Europe — full-course coverage, in season now.
  # mf_arome stays OFF: its domain ends at 37.5N (north-Sicily sliver only)

max_lead_hours: 120
keep_runs: 4        # was 8 — halved 2026-08-18: verify decodes every kept run per race and passes hit 39min CPU vs the 45min kill
data_dir: data
poll_minutes: 10

observations:
  metar: true      # LMML Malta, Sicily airports (Catania, Palermo, Trapani)
  windycator: false
  ndbc_stations: []
  mf_buoys: true          # Météo-France GTS buoys — one call, bbox-filtered
  openmeteo: false
  focus: {lat: 35.90, lon: 14.51}   # Grand Harbour, Malta
  nmea:
    enabled: false
    transport: udp
    port: 10110

trust:
  yacht: 1.0
  metar: 0.85
  ndbc: 0.9
  windycator: 0.8
  openmeteo: 0.4

scoring:
  window_h: 48
  half_weight_nm: 50
  lead_half_h: 30
  recency_half_h: 12
  err_scale_ms: 2.5
  publish_window_h: 24
